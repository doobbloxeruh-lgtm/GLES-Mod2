
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build GLES Mod and FCL Plugin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools and NDK
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Ninja and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip unzip

      - name: Verify Android toolchain
        run: |
          test -f "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/34.0.0/d8"
          cmake --version
          ninja --version

      - name: Build NeoForge mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Build and verify FCL renderer APK
        run: bash ./fcl-plugin/build-plugin-linux.sh

      - name: Upload native GLES libraries
        uses: actions/upload-artifact@v4
        with:
          name: glesmod-native-libraries
          path: build/native/*/libgl_gles.so
          if-no-files-found: error
          retention-days: 90

      - name: Upload FCL renderer APK
        uses: actions/upload-artifact@v4
        with:
          name: glesmod-renderer-plugin
          path: build/plugin/glesmod-renderer-plugin.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload NeoForge mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: glesmod-neoforge-mod
          path: build/libs/glesmod-*.jar
          if-no-files-found: error
          retention-days: 90
          
